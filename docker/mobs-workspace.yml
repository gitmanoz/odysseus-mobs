# Optional writable missao-mobs workspace mount.
#
# Enable on Linux/macOS in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/mobs-workspace.yml
#   MOBS_WORKSPACE_PATH=/absolute/path/to/missao-mobs
#
# Enable on Windows in .env:
#   COMPOSE_FILE=docker-compose.yml;docker/mobs-workspace.yml
#   MOBS_WORKSPACE_PATH=C:/absolute/path/to/missao-mobs
#
# The host path remains outside Git. Odysseus exposes the repository at
# /workspace/missao-mobs so it can be selected as an agent workspace.
services:
  odysseus:
    volumes:
      - type: bind
        source: ${MOBS_WORKSPACE_PATH:?Set MOBS_WORKSPACE_PATH to the host missao-mobs repository}
        target: /workspace/missao-mobs
