name: MOBS Auto follow-up

on:
  push:
    branches:
      - feature/mobs-auto-router-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobs-auto-router-v1
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_mobs_auto_followup.py
      - name: Validate
        run: |
          python -m py_compile routes/chat_routes.py src/llm_core.py src/mobs_auto_router.py tests/test_mobs_auto_router.py
          pytest -q tests/test_mobs_auto_router.py
          node --check static/js/chatRenderer.js
          node --check static/js/chat.js
          node --check static/js/modelPicker.js
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mobs-auto-followup.yml scripts/apply_mobs_auto_followup.py
          git add routes/chat_routes.py src/llm_core.py static/js/chatRenderer.js static/js/chat.js static/js/modelPicker.js
          git commit -m "fix: complete MOBS Auto identity and thinking behavior"
          git push origin HEAD:feature/mobs-auto-router-v1
