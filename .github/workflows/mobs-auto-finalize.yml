name: MOBS Auto one-shot consolidation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobs-auto-router-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobs-auto-router-v1
          fetch-depth: 0
      - name: Patch symbolic identity into streaming and cards
        shell: python
        run: |
          from pathlib import Path

          route_path = Path('routes/chat_routes.py')
          route = route_path.read_text(encoding='utf-8')

          old = '''    execution.model = route.model
    execution.endpoint_url = route.endpoint_url
    execution.headers = route.headers
'''
          new = '''    execution.model = route.model
    execution.endpoint_url = route.endpoint_url
    execution.headers = route.headers
    execution.mobs_auto_requested_model = route.requested_model
    execution.mobs_auto_display_name = route.display_name
    execution.mobs_auto_actual_model = route.model
'''
          if old in route:
              route = route.replace(old, new, 1)
          elif 'execution.mobs_auto_requested_model = route.requested_model' not in route:
              raise SystemExit('MOBS Auto execution metadata anchor not found')

          old = '''            _model_info = {"type": "model_info", "model": sess.model}
'''
          new = '''            _public_model = getattr(sess, "mobs_auto_display_name", None) or sess.model
            _model_info = {"type": "model_info", "model": _public_model}
            if getattr(sess, "mobs_auto_actual_model", None):
                _model_info["actual_model"] = sess.mobs_auto_actual_model
                _model_info["requested_model"] = getattr(sess, "mobs_auto_requested_model", "__mobs_auto__")
'''
          if old in route:
              route = route.replace(old, new, 1)
          elif '_public_model = getattr(sess, "mobs_auto_display_name", None) or sess.model' not in route:
              raise SystemExit('model_info anchor not found')

          old = '''                _requested_model = sess.model
                _actual_model = None
'''
          new = '''                _requested_model = getattr(sess, "mobs_auto_requested_model", None) or sess.model
                _actual_model = getattr(sess, "mobs_auto_actual_model", None)
'''
          count = route.count(old)
          if count:
              route = route.replace(old, new)
          elif 'getattr(sess, "mobs_auto_requested_model", None) or sess.model' not in route:
              raise SystemExit('requested/actual model anchors not found')

          route_path.write_text(route, encoding='utf-8')

          renderer_path = Path('static/js/chatRenderer.js')
          renderer = renderer_path.read_text(encoding='utf-8')
          marker = "const CHECK_ICON ="
          consts = "const MOBS_AUTO_MODEL_ID = '__mobs_auto__';\nconst MOBS_AUTO_DISPLAY = 'MOBS Auto';\n"
          if consts not in renderer:
              idx = renderer.find(marker)
              if idx < 0:
                  raise SystemExit('chatRenderer constant anchor not found')
              renderer = renderer[:idx] + consts + renderer[idx:]

          old = '''export function shortModel(name) {
  if (!name) return '...';
  if (typeof name !== 'string') name = String(name);
'''
          new = '''export function shortModel(name) {
  if (!name) return '...';
  if (typeof name !== 'string') name = String(name);
  if (name.trim() === MOBS_AUTO_MODEL_ID || name.trim() === MOBS_AUTO_DISPLAY) return MOBS_AUTO_DISPLAY;
'''
          if old in renderer:
              renderer = renderer.replace(old, new, 1)
          elif 'name.trim() === MOBS_AUTO_MODEL_ID' not in renderer:
              raise SystemExit('shortModel anchor not found')

          old = '''  if (!requested || sameModelName(requested, actual)) return shortModel(actual || requested);
  return shortModel(requested) + ' -> ' + shortModel(actual);
'''
          new = '''  if (requested === MOBS_AUTO_MODEL_ID || requested === MOBS_AUTO_DISPLAY) return MOBS_AUTO_DISPLAY;
  if (!requested || sameModelName(requested, actual)) return shortModel(actual || requested);
  return shortModel(requested) + ' -> ' + shortModel(actual);
'''
          if old in renderer:
              renderer = renderer.replace(old, new, 1)
          elif 'requested === MOBS_AUTO_MODEL_ID' not in renderer:
              raise SystemExit('modelRouteLabel anchor not found')

          renderer_path.write_text(renderer, encoding='utf-8')
      - name: Validate syntax and focused tests
        run: |
          python -m py_compile routes/chat_routes.py src/mobs_auto_router.py tests/test_mobs_auto_router.py
          pytest -q tests/test_mobs_auto_router.py
          node --check static/js/chatRenderer.js
      - name: Commit finalized integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add routes/chat_routes.py static/js/chatRenderer.js
          git commit -m "fix: preserve MOBS Auto identity through streaming"
          git push origin HEAD:feature/mobs-auto-router-v1
