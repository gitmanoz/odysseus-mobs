name: Apply MOBS Auto integration

on:
  push:
    branches:
      - feature/mobs-auto-router-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobs-auto-router-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration patch
        run: python scripts/install_mobs_auto.py

      - name: Run targeted tests
        run: python -m pytest tests/test_mobs_auto_router.py -q

      - name: Validate diff
        run: git diff --check

      - name: Commit integrated files
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/modelPicker.js routes/session_routes.py routes/chat_routes.py
          git commit -m "feat: integrate MOBS Auto routing"
          git push origin HEAD:feature/mobs-auto-router-v1
